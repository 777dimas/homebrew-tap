name: bump

# Once a day, look for a new gridhour release on PyPI. If there is one, build and test the bumped
# formula here (a PR opened with GITHUB_TOKEN does not trigger tests.yml) and open a PR with it.

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pypi.outputs.version }}
      url: ${{ steps.pypi.outputs.url }}
      sha256: ${{ steps.pypi.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pypi
        run: python3 -I .github/bump.py >> "$GITHUB_OUTPUT"

  test:
    needs: check
    if: needs.check.outputs.version != ''
    name: test ${{ needs.check.outputs.version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    env:
      VERSION: ${{ needs.check.outputs.version }}
      URL: ${{ needs.check.outputs.url }}
      SHA256: ${{ needs.check.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@f9676f1ffe2e1a720f81b2c54c51cfb99915ec14 # main, 2026-10-14
      - run: python3 -I .github/bump.py "$VERSION" "$URL" "$SHA256"
      - run: brew install --build-from-source 777dimas/tap/gridhour
      - run: brew test 777dimas/tap/gridhour
      - run: brew audit --strict --online 777dimas/tap/gridhour
      - run: gridhour --version | grep -Fx "gridhour $VERSION"

  pr:
    needs: [check, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
      URL: ${{ needs.check.outputs.url }}
      SHA256: ${{ needs.check.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open a PR unless one exists
        run: |
          branch="bump-gridhour-$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists, leaving it alone"
            exit 0
          fi
          python3 -I .github/bump.py "$VERSION" "$URL" "$SHA256"
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "gridhour $VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "gridhour $VERSION" \
            --body "Bumps the formula to gridhour $VERSION from PyPI. Built, tested and audited on macOS 26 and Ubuntu 24.04 in run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
